<!DOCTYPE html>
<html>

    <head>
        <title>Calculator</title>
        <link rel="stylesheet" href="style.css"/>
    </head>

    <body>

        <div id="calculator">
            <input readonly id="screen">
            
            <div id="functions" class="contents">
                <button data-value="sqrt(" data-eval="Math.sqrt(">sqrt</button>
                <button data-value="**">**</button>
                <button data-value="(">(</button>
                <button data-value=")">)</button>

                <button data-value="sin(" data-eval="sinDeg(">sin</button>
                <button data-value="cos(" data-eval="cosDeg(" >cos</button>
                <button data-value="tan(" data-eval="tanDeg(" >tan</button>
                <button data-value="Pi" data-eval="Math.PI">Pi</button>

                <button data-value="ln(" data-eval="Math.log(">ln</button>
                <button data-value="e" data-eval="Math.E">e</button>
                <button data-value="log(" data-eval="Math.log10(">log</button>
                <button data-value="10^" data-eval="10**">10^</button>

                <div id="enumerate">
                    <button data-value="fact(" class="enumerations">n!</button>
                    <button data-value="permute(" class="enumerations">nPr</button>
                    <button data-value="combine(" class="enumerations">nCr</button>
                </div>

               
            </div>
                
            <div  id="numbers" class="contents" >
                
                <button data-value="1" class="number">1</button>
                <button data-value="2" class="number">2</button>
                <button data-value="3" class="number">3</button>
                <button data-value="4" class="number">4</button>
                <button data-value="5" class="number">5</button>
                <button data-value="6" class="number">6</button>
                <button data-value="7" class="number">7</button>
                <button data-value="8" class="number">8</button>
                <button data-value="9" class="number">9</button>
                <button data-value="." class="number">.</button>
                <button data-value="0" class="number">0</button>
                <button data-value="," class="number">,</button>

            </div>
            
            <div id="operations" class="contents">
                <button data-action="backspace" class="action">DEL</button>
                <button data-action="clear" class="action">C</button>

                <button data-value="+" class="add">+</button>
                <button data-value="-" class="add">-</button>

                <button data-value="/" class="multiply">/</button>
                <button data-value="*" class="multiply">*</button>


                <button data-action="calculate" id="equal">=</button>

            </div>


        </div>
        

        <script src="script.js"></script>


    </body>

</html>
